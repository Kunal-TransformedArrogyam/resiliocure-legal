<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResilioCure</title>
  <meta name="description" content="ResilioCure policies and account deletion.">
  <style>
    :root { color-scheme: light dark; --bg:#f4f7f5; --card:#fff; --text:#0f172a; --muted:#475467; --accent:#12a66a; --line:#e4e7ec; }
    @media (prefers-color-scheme: dark) { :root { --bg:#03111f; --card:#0b2540; --text:#f8fafc; --muted:#a8b8c8; --accent:#20d489; --line:#153b60; } }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width:640px; margin:0 auto; padding:48px 20px; }
    .brand { color:var(--accent); font-weight:800; letter-spacing:.08em; font-size:.8rem; }
    h1 { margin:4px 0 8px; font-size:1.8rem; }
    p { color:var(--muted); }
    a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-top:14px; color:var(--text); text-decoration:none; font-weight:700; }
    a.card span { display:block; color:var(--muted); font-weight:400; font-size:.92rem; margin-top:2px; }
  </style>
</head>
<body>
<main>
  <div class="brand">RESILIOCURE</div>
  <h1>ResilioCure</h1>
  <p>A wellness and resilience app by Transformed Arrogyam Private Limited.</p>
  <a class="card" href="privacy-policy.html">Privacy Policy
    <span>What we collect, how we use it and how you can delete it.</span></a>
  <a class="card" href="account-deletion.html">Delete your account
    <span>How to delete your ResilioCure account and data.</span></a>
  <p style="margin-top:28px">Contact: <a href="mailto:kunal@transformed-healthcare.com" style="color:var(--accent)">kunal@transformed-healthcare.com</a></p>
</main>
</body>
</html>
